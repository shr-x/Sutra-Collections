services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No host port exposure — only reachable inside the Docker network
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sutra_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SA_SESSION_SECRET: ${SA_SESSION_SECRET}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Sutra Collections}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_WEBHOOK_TOKEN: ${WHATSAPP_WEBHOOK_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      db:
        condition: service_healthy
    # Only persistent data dirs — no source code mounts
    volumes:
      - ./backups:/app/backups
      - app_uploads:/app/public/uploads
    networks:
      - sutra_net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Same volume the app writes uploads into — nginx serves /uploads/*
      # directly from here so newly-uploaded files never depend on Next.js's
      # in-memory public-folder listing (built once at `next start` boot;
      # files added after that point 404 until the app process restarts).
      - app_uploads:/usr/share/nginx/uploads:ro
      # Uncomment after running certbot:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - sutra_net

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sutra_net

  updater:
    build:
      context: ./updater
      dockerfile: Dockerfile
    restart: always
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /repo
    networks:
      - sutra_net

volumes:
  postgres_data:
  app_uploads:

networks:
  sutra_net:
    driver: bridge
