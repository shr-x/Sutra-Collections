events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;

  # Increase upload limit for design photos, logo, etc.
  client_max_body_size 20M;

  # Logging
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
  gzip_min_length 256;

  # ── Upstream ──────────────────────────────────────────────────────────────
  upstream sutra_app {
    server app:3000;
  }

  # ── HTTP — redirect all traffic to HTTPS once SSL is set up ───────────────
  server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge (needed before SSL works)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Health check (no redirect so load balancer / monitoring still works)
    location /api/health {
      proxy_pass http://sutra_app;
      proxy_set_header Host $host;
    }

    # Uploaded files (scheme banners, item/design photos, logo) served
    # directly from the shared volume — bypasses Next.js entirely so newly
    # uploaded files are always visible immediately. next start caches its
    # public-folder listing once at boot, so files written to the app's own
    # public/uploads after that point 404 from Next.js until it restarts;
    # nginx has no such cache and always reflects the live filesystem.
    location /uploads/ {
      alias /usr/share/nginx/uploads/;
      access_log off;
      expires 7d;
    }

    # ── Uncomment the line below once SSL cert is issued ──────────────────
    # return 301 https://$host$request_uri;

    # ── Until SSL is set up, proxy HTTP directly ──────────────────────────
    location / {
      proxy_pass         http://sutra_app;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 120s;
    }
  }

  # ── HTTPS — uncomment entire block after running certbot ──────────────────
  # server {
  #   listen 443 ssl http2;
  #   server_name yourdomain.com;
  #
  #   ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
  #
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #   ssl_session_cache   shared:SSL:10m;
  #   ssl_session_timeout 10m;
  #
  #   client_max_body_size 20M;
  #
  #   location /uploads/ {
  #     alias /usr/share/nginx/uploads/;
  #     access_log off;
  #     expires 7d;
  #   }
  #
  #   location / {
  #     proxy_pass         http://sutra_app;
  #     proxy_http_version 1.1;
  #     proxy_set_header   Upgrade $http_upgrade;
  #     proxy_set_header   Connection 'upgrade';
  #     proxy_set_header   Host $host;
  #     proxy_set_header   X-Real-IP $remote_addr;
  #     proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
